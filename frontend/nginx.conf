server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers (Sprint 9 hardening). TLS itself is expected
    # to be terminated upstream (load balancer/ingress) - see DEPLOYMENT.md -
    # so Strict-Transport-Security is not set here to avoid a false promise
    # on a plain-HTTP origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:3000/api/;
    }

    location / {
        try_files $uri /index.html;
    }
}

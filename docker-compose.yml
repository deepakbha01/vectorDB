version: "3.9"

services:
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vector_platform
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: vector_platform
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_DB_HOST: app-db
      APP_DB_PORT: 5432
      APP_DB_USER: vector_platform
      APP_DB_PASSWORD: change-me
      APP_DB_NAME: vector_platform
      JWT_SECRET: change-me-to-a-long-random-value
      NODE_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      AI_FACTORY_ENABLED: ${AI_FACTORY_ENABLED:-false}
      TOKEN_OBSERVABILITY_ENABLED: ${TOKEN_OBSERVABILITY_ENABLED:-false}
    ports:
      - "3000:3000"
    depends_on:
      app-db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Optional live telemetry (Token Observability, spec §11). Start with:
  #   AI_FACTORY_INGEST_KEY=aftk_... docker compose --profile telemetry up
  # Applications then send OTLP to localhost:4317 (gRPC) or localhost:4318 (HTTP).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["telemetry"]
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    environment:
      # Empty = the backend answers 401 and the collector logs it; the rest of the stack is unaffected.
      AI_FACTORY_INGEST_KEY: ${AI_FACTORY_INGEST_KEY:-}
      AI_FACTORY_OTLP_ENDPOINT: ${AI_FACTORY_OTLP_ENDPOINT:-http://backend:3000/api/observability/v1/traces}
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - backend

volumes:
  app-db-data:

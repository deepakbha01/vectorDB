# AI Factory Wave 5 - deployment targets for the Infrastructure Decision
# Record (spec Â§9). Read only by the ai-factory module (the vector engines'
# infrastructure.yaml is untouched).
#
# Technology-neutral: every target and platform is judged by the same rules;
# none is preferred in code. Service names are for readability. GPU
# availability is DIRECTIONAL - confirm regional capacity and quota (or
# on-premises procurement lead time) before committing. Tiers are relative
# 1-5 planning ratings (5 = most / easiest).

rulesVersion: infrastructure-2026.10-3

targets:
  on_premises:
    label: On-premises
    platforms:
      kubernetes: Kubernetes platform (e.g. OpenShift, Rancher, upstream)
      vm: Virtualisation platform VMs
    gpus: [l4, l40s, rtx-pro-6000-96, h100-80, h200-141, b200-180, b300-288, gb200-186, gb300-288]   # any, subject to procurement
    availabilityZones: false          # failure domains depend on the customer's sites
    multiRegion: false
    privateNetworking: Data-centre network segmentation and firewalls
    keyManagement: On-premises HSM / key management service
    backup: Enterprise backup to object storage or tape
    elasticity: 1
    operationalSimplicity: 1
    dataControl: 5
  azure:
    label: Azure
    platforms:
      kubernetes: Azure Kubernetes Service (AKS)
      vm: Azure Virtual Machines
      managed: Azure AI services / Azure managed databases
    gpus: [rtx-pro-6000-96, h100-80, h200-141, gb200-186, gb300-288]   # NC RTXPRO6000BSE v6, NCads/ND H100 v5, ND H200 v5, ND GB200 v6, ND GB300 v6
    availabilityZones: true
    multiRegion: true
    privateNetworking: Private Link / private endpoints
    keyManagement: Azure Key Vault (customer-managed keys)
    backup: Azure Backup
    elasticity: 5
    operationalSimplicity: 4
    dataControl: 3
  aws:
    label: AWS
    platforms:
      kubernetes: Amazon EKS
      vm: Amazon EC2
      managed: AWS managed AI services / Amazon RDS
    gpus: [l4, l40s, rtx-pro-6000-96, h100-80, h200-141, b200-180, b300-288, gb200-186]   # G6, G6e, G7e, P5, P5e/P5en, P6-B200, P6-B300, P6e-GB200
    availabilityZones: true
    multiRegion: true
    privateNetworking: AWS PrivateLink / VPC endpoints
    keyManagement: AWS KMS (customer-managed keys)
    backup: AWS Backup
    elasticity: 5
    operationalSimplicity: 4
    dataControl: 3
  oci:
    label: OCI
    platforms:
      kubernetes: OCI Kubernetes Engine (OKE)
      vm: OCI Compute
      managed: OCI AI services / OCI managed databases
    gpus: [l40s, h100-80, h200-141, b200-180, gb200-186, gb300-288]   # BM.GPU.L40S, H100, H200, B200, GB200, GB300 shapes
    availabilityZones: true
    multiRegion: true
    privateNetworking: Private endpoints / service gateway
    keyManagement: OCI Vault
    backup: OCI Block Volume / Object Storage backup
    elasticity: 4
    operationalSimplicity: 4
    dataControl: 3
  gcp:
    label: GCP
    platforms:
      kubernetes: Google Kubernetes Engine (GKE)
      vm: Compute Engine
      managed: Vertex AI / Cloud SQL
    gpus: [l4, rtx-pro-6000-96, h100-80, h200-141, b200-180, gb200-186, gb300-288]   # G2, G4, A3, A3 Ultra, A4, A4X, A4X Max
    availabilityZones: true
    multiRegion: true
    privateNetworking: Private Service Connect / VPC Service Controls
    keyManagement: Cloud KMS (customer-managed keys)
    backup: Backup and DR Service
    elasticity: 5
    operationalSimplicity: 4
    dataControl: 3

# Fully managed vector SaaS - where each is offered (directional).
saasAvailability:
  pinecone: [aws, azure, gcp]
  mongodb_atlas: [aws, azure, gcp]

# Minimum ops capability (inference assessment scale) to run a platform without it becoming a CONDITION.
platformOpsRequirement: { kubernetes: dedicated_team, vm: part_time, managed: none, saas: none, in_app: none }
opsCapabilityOrder: [none, part_time, dedicated_team, platform_team]

scoringWeights:
  elasticity: 0.20
  operationalSimplicity: 0.25
  dataControl: 0.20
  availability: 0.15
  coLocation: 0.20
# Data control counts more for restricted data (weight multiplier, re-normalised).
restrictedDataControlMultiplier: 2

# Host CPU for the on-premises CPU nodes (vector database, application,
# gateway, agent tools). x86 is the default. Grace and Vera are Arm64: every
# image on those nodes must ship an arm64 build. Rack-scale GPU systems
# (config/inference.yaml systems) bring their own Grace / Vera host CPUs
# whatever is chosen here. Cloud CPU families are the provider's choice and
# are not modelled.
hostCpus:
  x86:
    label: x86-64 (Intel Xeon / AMD EPYC)
    arch: x86_64
    availability: ga
  grace:
    label: NVIDIA Grace (72 Arm Neoverse V2 cores, LPDDR5X)
    arch: arm64
    availability: ga
  vera:
    label: NVIDIA Vera (88 Olympus Arm cores, up to 1.5 TB LPDDR5X at 1.2 TB/s)
    arch: arm64
    availability: preview
    availabilityNote: In full production; first systems with early customers, partner servers (Dell, HPE, Lenovo, Supermicro) from the second half of 2026 - confirm delivery dates.

# Vector databases with official arm64 (aarch64) Linux builds or images.
# Platforms not listed need their arm64 support confirmed.
arm64VectorPlatforms: [postgres_pgvector, oracle, milvus, qdrant, weaviate, chroma, elasticsearch, redis, lancedb]

# Sizing assumptions for components the upstream phases do not size.
assumptions:
  applicationNodes: 2
  applicationVcpusPerNode: 4
  modelVersionsKept: 2
  warmStandbyRtoMinutes: 60

# ---------------------------------------------------------------------------
# Wave 13 - on-premises reference stacks (compute + storage + platform).
# Evaluated whenever on-premises is an allowed target. Like the targets above,
# every stack is judged by the same rules and none is preferred in code.
#
# DIRECTIONAL: product names, GPU ranges, replication RPOs and throughputs are
# planning figures for comparing stacks, not vendor commitments. Confirm the
# current models, NVIDIA certifications, support terms and pricing with each
# vendor, and measure load / restore throughput in the proof of concept.
# EMC is now the Dell storage line (PowerScale, PowerStore, PowerMax) - one vendor.
#
# Fields:
#   vendors            existing-estate storage keys that count as reuse
#   hypervisors        existing-estate hypervisors that count as reuse
#   gpus               { min, sweetSpotMax, max } GPUs at peak the stack is built for
#                      (below min = oversized; above max = not eligible; max null = no ceiling)
#   trainingCapable    sustains full fine-tuning / training (parallel throughput, checkpoints)
#   opsRequirement     minimum ops capability (opsCapabilityOrder) to run it unconditionally
#   tiers              product per storage tier; null = not offered by the stack
#   replication        { syncSupported, minAsyncRpoMinutes } natively, without extra products
#   cloudExtension     targets with a first-party / marketplace service of the same storage OS
#   throughput         planning GB/min per recovering node: modelLoad (weights), restore (vector data)
#   ratings            relative 1-5 (5 = most / easiest / costliest)
# ---------------------------------------------------------------------------
onPremStacks:
  nutanix_hci:
    label: Nutanix HCI + Nutanix Unified Storage
    vendors: [nutanix]
    hypervisors: [nutanix_ahv]
    compute: Nutanix NX or OEM HCI nodes (e.g. Dell XC) with NVIDIA L40S / H100 GPUs
    platform: Nutanix Enterprise AI on Nutanix Kubernetes Platform (NKP), AHV for VMs
    tiers:
      block: Nutanix Volumes (distributed storage fabric on local NVMe)
      file: Nutanix Files
      object: Nutanix Objects
      parallel: null
    gpus: { min: 0, sweetSpotMax: 16, max: 32 }
    trainingCapable: false
    opsRequirement: part_time
    replication: { syncSupported: true, minAsyncRpoMinutes: 1 }   # Metro Availability / NearSync
    cloudExtension: [azure, aws]                                   # Nutanix Cloud Clusters (NC2)
    throughput: { modelLoadGbPerMinute: 15, restoreGbPerMinute: 6 }
    ratings: { operationalSimplicity: 5, throughput: 2, cost: 2 }
    bestFor: Inference-only RAG at small to mid scale, branch / edge sites, VMware exits, small operations teams
    support:
      contract: One vendor for HCI software and NX hardware (OEM nodes - hardware support from the OEM)
      ownership: "L1 customer IT; L2 Nutanix support; L3 Nutanix engineering; NVIDIA AI Enterprise for GPU software"
      telemetry: Nutanix Pulse call-home and Insights (predictive alerts, automatic case creation)
  dell_powerscale:
    label: Dell PowerEdge XE + PowerScale / PowerStore (Dell AI Factory)
    vendors: [dell_emc]
    hypervisors: []
    compute: Dell PowerEdge XE GPU servers (8 x H100 / H200 per node)
    platform: Kubernetes (OpenShift / Rancher / upstream) on bare metal, NVIDIA AI Enterprise
    tiers:
      block: Dell PowerStore (NVMe block)
      file: Dell PowerScale (OneFS scale-out NAS, NFS over RDMA, GPUDirect Storage)
      object: Dell ObjectScale
      parallel: Dell PowerScale (NVIDIA DGX SuperPOD-certified configurations)
    gpus: { min: 8, sweetSpotMax: 256, max: null }
    trainingCapable: true
    opsRequirement: dedicated_team
    replication: { syncSupported: true, minAsyncRpoMinutes: 5 }    # PowerStore Metro / SyncIQ
    cloudExtension: [azure, aws]                                    # APEX File Storage (OneFS)
    throughput: { modelLoadGbPerMinute: 30, restoreGbPerMinute: 10 }
    ratings: { operationalSimplicity: 3, throughput: 4, cost: 3 }
    bestFor: Enterprise RAG and fine-tuning where one vendor should own compute and storage
    support:
      contract: One vendor (Dell ProSupport) for compute and storage; NVIDIA AI Enterprise for GPU software
      ownership: "L1 customer IT; L2 Dell ProSupport; L3 Dell engineering, NVIDIA for GPU software"
      telemetry: Dell CloudIQ / APEX AIOps (health, capacity forecasts, automatic case creation)
  dell_netapp:
    label: Dell PowerEdge XE + NetApp ONTAP AFF (AIPod)
    vendors: [netapp]
    hypervisors: []
    compute: Dell PowerEdge XE GPU servers (8 x H100 / H200 per node)
    platform: Kubernetes (OpenShift / Rancher / upstream) with NetApp Trident, NVIDIA AI Enterprise
    tiers:
      block: NetApp ONTAP AFF (NVMe/TCP, iSCSI)
      file: NetApp ONTAP AFF (NFS over RDMA, GPUDirect Storage)
      object: NetApp ONTAP S3 / StorageGRID
      parallel: null
    gpus: { min: 0, sweetSpotMax: 64, max: null }
    trainingCapable: true
    opsRequirement: dedicated_team
    replication: { syncSupported: true, minAsyncRpoMinutes: 5 }    # SnapMirror (sync / async), MetroCluster
    cloudExtension: [azure, aws, gcp]                               # Azure NetApp Files, FSx for ONTAP, Google Cloud NetApp Volumes
    throughput: { modelLoadGbPerMinute: 30, restoreGbPerMinute: 10 }
    ratings: { operationalSimplicity: 3, throughput: 4, cost: 3 }
    bestFor: Hybrid enterprise RAG on an existing NetApp estate, with DR or bursting to Azure / AWS / GCP
    support:
      contract: Two vendors - Dell ProSupport for compute, NetApp SupportEdge for storage - joined by the NVIDIA-validated AIPod design
      ownership: "L1 customer IT; L2 Dell (compute) / NetApp (storage) - customer or partner triages; L3 vendor engineering"
      telemetry: NetApp Active IQ (Digital Advisor) + Dell CloudIQ / APEX AIOps
  dell_vast:
    label: Dell PowerEdge XE + VAST Data
    vendors: [vast_data]
    hypervisors: []
    compute: Dell PowerEdge XE GPU servers (8 x H100 / H200 per node)
    platform: Kubernetes with the VAST CSI driver, NVIDIA AI Enterprise
    tiers:
      block: VAST (NVMe/TCP block)
      file: VAST (NFS over RDMA, multi-protocol, GPUDirect Storage)
      object: VAST (S3 on the same namespace)
      parallel: VAST (all-flash, NVIDIA DGX SuperPOD-certified)
    gpus: { min: 16, sweetSpotMax: 4096, max: null }
    trainingCapable: true
    opsRequirement: dedicated_team
    replication: { syncSupported: false, minAsyncRpoMinutes: 15 }
    cloudExtension: [aws, azure, gcp]                               # VAST on Cloud (marketplace)
    throughput: { modelLoadGbPerMinute: 60, restoreGbPerMinute: 20 }
    ratings: { operationalSimplicity: 4, throughput: 5, cost: 4 }
    bestFor: Large GPU estates that want one data platform for training, inference and RAG (file, object, vectors)
    support:
      contract: Two vendors - Dell ProSupport for compute, VAST support for storage
      ownership: "L1 customer IT; L2 Dell (compute) / VAST (storage); L3 vendor engineering"
      telemetry: VAST Uplink call-home + Dell CloudIQ / APEX AIOps
  dell_ddn:
    label: Dell PowerEdge XE + DDN EXAScaler (A3I)
    vendors: [ddn]
    hypervisors: []
    compute: Dell PowerEdge XE GPU servers (8 x H100 / H200 per node)
    platform: Kubernetes or Slurm on bare metal with the Lustre client, NVIDIA AI Enterprise
    tiers:
      block: null
      file: DDN EXAScaler (Lustre)
      object: DDN Infinia
      parallel: DDN EXAScaler (Lustre, NVIDIA DGX SuperPOD-certified)
    gpus: { min: 32, sweetSpotMax: 4096, max: null }
    trainingCapable: true
    opsRequirement: platform_team
    replication: { syncSupported: false, minAsyncRpoMinutes: 60 }
    cloudExtension: [azure, gcp]                                    # Azure Managed Lustre, Google Cloud Managed Lustre (DDN-based)
    throughput: { modelLoadGbPerMinute: 80, restoreGbPerMinute: 15 }
    ratings: { operationalSimplicity: 2, throughput: 5, cost: 4 }
    bestFor: Training and checkpoint-heavy work on large GPU clusters where throughput matters most
    support:
      contract: Two vendors - Dell ProSupport for compute, DDN support for storage
      ownership: "L1 customer IT / HPC team; L2 Dell (compute) / DDN (storage); L3 vendor engineering"
      telemetry: DDN Insight monitoring + Dell CloudIQ / APEX AIOps

# Existing-estate answers the Infrastructure Design form offers.
estateStorageVendors: { netapp: NetApp, nutanix: Nutanix, dell_emc: Dell / EMC, vast_data: VAST Data, ddn: DDN, other: Other }
estateHypervisors: { vmware: VMware vSphere, nutanix_ahv: Nutanix AHV, hyper_v: Microsoft Hyper-V, none: None / bare metal }

stackScoringWeights:
  scaleFit: 0.25
  estateReuse: 0.20
  operationalSimplicity: 0.20
  dataProtection: 0.15
  throughput: 0.10
  hybridCloud: 0.10
# Full fine-tuning / training makes throughput count more (weight multiplier, re-normalised).
trainingThroughputMultiplier: 3
# Extra block capacity kept for snapshots on the vector database volume.
snapshotReserve: 0.3

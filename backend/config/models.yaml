# Weighted scoring AFTER eligibility (spec §3: eligibility is separate from scoring).
scoringWeights:
  quality: 0.30
  reasoning: 0.15
  latency: 0.15
  cost: 0.20
  contextHeadroom: 0.10
  deploymentFlexibility: 0.10
# A priority set to "high" multiplies that criterion's weight (weights are re-normalised).
priorityMultiplier: 1.6
# Minimum relative tiers per requirement level (below → CONDITIONAL, never silently accepted).
accuracyMinQualityTier: { standard: 2, high: 3, critical: 4 }
reasoningMinTier: { low: 1, medium: 2, high: 3 }
# Primary vs runner-up score gap below which confidence drops to medium.
confidenceMargin: 0.05

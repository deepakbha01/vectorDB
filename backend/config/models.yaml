# AI Factory Wave 3 - model catalogue for Model Selection (spec §7).
#
# Technology-neutral by construction:
#  - open-weight models use the SAME ids as config/inference.yaml, so a chosen
#    model can be sized for serving without re-entry;
#  - proprietary models are represented as vendor-neutral API TIERS matching
#    inference.yaml's managedApiTiers (small / mid / frontier), not named
#    products, so no vendor is ever the hard-coded winner.
#
# Tiers are RELATIVE 1-5 planning ratings (5 = best / fastest / cheapest),
# not benchmark results - every recommendation that uses them says so and
# asks for an evaluation on the customer's own data. Context windows and
# capabilities are directional; verify against the model card / provider
# documentation before committing.

rulesVersion: models-2026.09-1

licences:
  apache_2: { label: Apache 2.0, permissive: true, note: "Permissive; commercial use allowed." }
  llama_community: { label: Llama Community License, permissive: false, note: "Commercial use allowed with an acceptable-use policy and a 700M monthly-active-user threshold." }
  qwen: { label: Qwen License, permissive: false, note: "Commercial use allowed; separate terms above 100M monthly active users." }
  commercial_api: { label: Provider terms of service, permissive: false, note: "Usage governed by the API provider's terms and data-processing agreement." }


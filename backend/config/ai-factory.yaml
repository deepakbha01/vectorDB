# AI Factory - Wave 1 foundations: phase dependency graph, parameter impact
# map, and the guided 01-14 workflow.
#
# Read only by the ai-factory module. It never changes how the existing
# phases compute anything; it only describes how their deliverables relate so
# the AI Factory view can show lineage, staleness and impact.

rulesVersion: ai-factory-2026.09-12

# ---------------------------------------------------------------------------
# Phase dependency graph. `dependsOn` lists the DIRECT upstream deliverables
# each phase's service actually reads when it runs (verified from the code):
#   hard     - the phase's output is computed from that upstream deliverable
#   advisory - the upstream only pre-fills suggestions the user can override
# Staleness propagates downstream through hard edges only.
# ---------------------------------------------------------------------------
phases:
  - key: discovery
    label: Discovery assessment
    route: discovery
    dependsOn: []
  - key: data_embeddings
    label: Data & Embedding design
    route: data-pipeline
    dependsOn:
      - { phase: discovery, kind: hard }
  - key: index_design
    label: Index design
    route: index-design
    dependsOn:
      - { phase: data_embeddings, kind: hard }
  - key: vector_db_selection
    label: Vector DB selection (ADR)
    route: vector-db-selection
    dependsOn:
      - { phase: discovery, kind: hard }
      - { phase: data_embeddings, kind: hard }
      - { phase: index_design, kind: hard }
  - key: infrastructure
    label: Deployment plan
    route: deployment
    dependsOn:
      - { phase: data_embeddings, kind: hard }
      - { phase: index_design, kind: hard }
      - { phase: vector_db_selection, kind: hard }   # target platform
  - key: optimization
    label: Optimization report (vector benchmark)
    route: optimization
    dependsOn:
      - { phase: index_design, kind: hard }
      - { phase: vector_db_selection, kind: hard }
  - key: capacity
    label: Capacity plan
    route: capacity
    dependsOn:
      - { phase: discovery, kind: hard }
      - { phase: index_design, kind: hard }
      - { phase: vector_db_selection, kind: hard }
  - key: inference
    label: Inference assessment
    route: inference
    dependsOn:
      - { phase: discovery, kind: advisory }
      - { phase: data_embeddings, kind: advisory }
      - { phase: workload_profile, kind: advisory }
      - { phase: model_selection, kind: advisory }   # model choice pre-fills, never fixes, the inference design (spec §8)
  - key: workload_profile
    label: AI Workload Profile
    route: workload-profile
    dependsOn:
      - { phase: discovery, kind: advisory }   # Discovery answers only pre-fill blanks
  - key: model_selection
    label: Model selection
    route: model-selection
    dependsOn:
      - { phase: workload_profile, kind: hard }   # requirements are computed from the profile
  - key: inference_architecture
    label: Inference architecture
    route: inference-architecture
    dependsOn:
      - { phase: inference, kind: hard }          # designed around its sizing
      - { phase: model_selection, kind: hard }    # routing uses primary / secondary / fallback
      - { phase: workload_profile, kind: hard }   # deployment targets and data classification gate eligibility
  - key: token_observability
    label: Token observability
    route: token-observability
    # Estimated mode projects tokens and cost from what these phases decided (spec: Token Observability §12, §17).
    dependsOn:
      - { phase: discovery, kind: hard }                # monthly budget; corpus size and growth for new-document embedding tokens
      - { phase: data_embeddings, kind: hard }          # embedding model, its price and chunk size
      - { phase: model_selection, kind: hard }          # primary model and its price tier
      - { phase: inference, kind: hard }                # requests / month, input and output tokens, sourcing and contracted prices
      - { phase: rag_agent_architecture, kind: hard }   # context budget, top-K, reranker and agent steps
      - { phase: workload_profile, kind: advisory }     # RAG / agent scope when there is no RAG / agent design yet
  - key: infrastructure_design
    label: Infrastructure design
    route: infrastructure-design
    dependsOn:
      - { phase: discovery, kind: hard }                # availability, RPO / RTO, multi-region, Kubernetes, ops capability
      - { phase: workload_profile, kind: hard }         # allowed targets, data classification, GPUs
      - { phase: vector_db_selection, kind: hard }      # platform and sizing estimate
      - { phase: inference, kind: hard }                # GPU type and count
      - { phase: inference_architecture, kind: hard }   # runtime platform
      - { phase: capacity, kind: advisory }             # growth horizon for storage
  - key: rag_agent_architecture
    label: RAG / agent architecture
    route: rag-agent
    dependsOn:
      - { phase: discovery, kind: hard }                # search requirements, top-K, precision, tenant isolation
      - { phase: workload_profile, kind: hard }         # RAG / agent scope, criticality, targets, classification
      - { phase: data_embeddings, kind: hard }          # embedding model, chunk size, metadata fields
      - { phase: vector_db_selection, kind: hard }      # platform and its native hybrid / filtering support
      - { phase: model_selection, kind: hard }          # context window, tool calling, accuracy and latency priorities
      - { phase: inference, kind: hard }                # output tokens, TTFT target, third-party API policy
      - { phase: inference_architecture, kind: hard }   # latency estimates and the policy engine
  - key: security_governance
    label: Security & governance
    route: security-governance
    dependsOn:
      - { phase: discovery, kind: hard }                # authentication, RBAC, encryption, keys, audit, retention, tenant isolation
      - { phase: workload_profile, kind: hard }         # classification, PII / PHI / PCI, residency, targets
      - { phase: data_embeddings, kind: hard }          # embedding provider (documents leave the boundary?)
      - { phase: vector_db_selection, kind: hard }      # platform and its compliance gate
      - { phase: model_selection, kind: hard }          # model families and licences
      - { phase: inference_architecture, kind: hard }   # gateway, policy engine, runtime
      - { phase: infrastructure_design, kind: hard }    # placements, network and key management
      - { phase: rag_agent_architecture, kind: hard }   # reranker, prompt and agent controls
  - key: performance_benchmark
    label: Performance & benchmark
    route: performance
    dependsOn:
      - { phase: discovery, kind: hard }                # recall, QPS and latency targets, corpus size, available CPU / RAM
      - { phase: workload_profile, kind: hard }         # end-to-end latency target
      - { phase: data_embeddings, kind: hard }          # chunk size and embedding price
      - { phase: index_design, kind: hard }             # vector measurements must post-date it
      - { phase: vector_db_selection, kind: hard }      # CPU / RAM estimate
      - { phase: optimization, kind: hard }             # measured vector benchmark
      - { phase: inference, kind: hard }                # TTFT / TPOT targets, GPU sizing
      - { phase: model_selection, kind: hard }          # accuracy requirement (quality target)
      - { phase: inference_architecture, kind: hard }   # P50 / P95 / P99 estimates
      - { phase: infrastructure_design, kind: hard }    # deployment model (network)
      - { phase: rag_agent_architecture, kind: hard }   # end-to-end latency budget
  - key: finops
    label: Cost & FinOps
    route: finops
    dependsOn:
      - { phase: discovery, kind: hard }                # budget, corpus, growth, availability, RTO, multi-region
      - { phase: workload_profile, kind: hard }         # allowed targets
      - { phase: data_embeddings, kind: hard }          # embedding model, price and chunk size
      - { phase: vector_db_selection, kind: hard }      # platform and sizing estimate
      - { phase: inference, kind: hard }                # GPU spend, managed API cost, demand
      - { phase: inference_architecture, kind: hard }   # managed or self-hosted serving
      - { phase: infrastructure_design, kind: hard }    # chosen placement per component
  - key: operations_model
    label: Operations model
    route: operations-model
    dependsOn:
      - { phase: discovery, kind: hard }                # availability, RPO, RTO, multi-region, operational capability
      - { phase: vector_db_selection, kind: hard }      # platform and storage to restore
      - { phase: capacity, kind: hard }                 # growth horizons, HA / DR recommendations
      - { phase: inference, kind: hard }                # replicas, model weights, TTFT target
      - { phase: model_selection, kind: hard }          # models to version and fail over between
      - { phase: inference_architecture, kind: hard }   # autoscaling, load balancing, fallback, observability
      - { phase: infrastructure_design, kind: hard }    # targets, sites and DR design
      - { phase: rag_agent_architecture, kind: advisory } # agents that act add operational load
  - key: final_recommendation
    label: Final recommendation
    route: final-recommendation
    # Combines every phase: any change upstream makes the recommendation and its readiness gate out of date.
    dependsOn:
      - { phase: discovery, kind: hard }
      - { phase: workload_profile, kind: hard }
      - { phase: data_embeddings, kind: hard }
      - { phase: index_design, kind: hard }
      - { phase: vector_db_selection, kind: hard }
      - { phase: model_selection, kind: hard }
      - { phase: inference, kind: hard }
      - { phase: inference_architecture, kind: hard }
      - { phase: infrastructure_design, kind: hard }
      - { phase: rag_agent_architecture, kind: hard }
      - { phase: security_governance, kind: hard }
      - { phase: performance_benchmark, kind: hard }
      - { phase: finops, kind: hard }
      - { phase: operations_model, kind: hard }

# ---------------------------------------------------------------------------
# Parameter impact map (spec §22). Which phases must be re-run when a
# Discovery answer changes. Downstream phases are added automatically through
# the hard edges above, so only list the phases that read the field directly.
# `none` marks fields reviewed and found to affect no computed decision.
# Every Discovery field must appear here - a unit test enforces it.
# ---------------------------------------------------------------------------
parameterImpact:
  # Verified against the code: data_embeddings reads Discovery in
  # DataPipelineDesignService; vector_db_selection passes the assessment into
  # RecommendationEngineService (AssessmentInput fields); capacity and
  # inference read the fields listed. "none" = captured but not read by any
  # engine today. Wave 2: the AI Workload Profile now reads several fields that
  # were "none" before (documentCount, concurrentUsers, deploymentEnvironment,
  # hasGpu, regulatoryRequirements).
  # corpus & scale
  environment: none
  documentCount: [workload_profile, performance_benchmark, finops, token_observability]
  documentGrowthPercentPerMonth: [capacity, workload_profile, finops, token_observability]
  avgDocumentSizeKb: none
  chunksPerDocument: [performance_benchmark, finops, token_observability]
  estimatedVectorCount: [data_embeddings, vector_db_selection, workload_profile, performance_benchmark]
  embeddingDimension: [data_embeddings, vector_db_selection]
  similarityMetric: [data_embeddings]
  # performance & SLAs
  qps: [data_embeddings, vector_db_selection, inference, workload_profile, finops]
  peakQps: [data_embeddings, vector_db_selection, inference, workload_profile, performance_benchmark]
  qpsScope: [vector_db_selection]
  concurrentUsers: [workload_profile]
  targetP95LatencyMs: [data_embeddings, vector_db_selection, rag_agent_architecture, performance_benchmark]
  targetP99LatencyMs: [vector_db_selection, performance_benchmark]
  availabilityTargetPercent: [capacity, inference, workload_profile, infrastructure_design, finops, operations_model]
  rpoMinutes: [vector_db_selection, capacity, infrastructure_design, operations_model]
  rtoMinutes: [vector_db_selection, capacity, infrastructure_design, finops, operations_model]
  retentionDays: [vector_db_selection, security_governance]
  # search capabilities
  requiresSimilaritySearch: [rag_agent_architecture]
  requiresSemanticSearch: [rag_agent_architecture]
  requiresHybridSearch: [data_embeddings, vector_db_selection, rag_agent_architecture]
  requiresMetadataFiltering: [vector_db_selection, rag_agent_architecture]
  requiresFullTextSearch: [vector_db_selection, rag_agent_architecture]
  topK: [data_embeddings, inference, rag_agent_architecture]
  recallTarget: [data_embeddings, vector_db_selection, performance_benchmark]
  precisionTarget: [vector_db_selection, rag_agent_architecture]
  requiresReranking: [data_embeddings, vector_db_selection, rag_agent_architecture]
  ndcgTarget: [vector_db_selection]
  mrrTarget: [vector_db_selection]
  # existing platforms & deployment
  hasExistingOracle: [vector_db_selection]
  hasExistingPostgres: [vector_db_selection]
  hasExistingKubernetes: [vector_db_selection, infrastructure_design]
  existingPlatforms: [vector_db_selection]
  deploymentEnvironment: [workload_profile]
  availableCpuCores: [capacity, performance_benchmark]
  availableRamGb: [data_embeddings, performance_benchmark]
  availableStorageGb: [capacity]
  hasGpu: [workload_profile, infrastructure_design, rag_agent_architecture]
  operationalCapability: [vector_db_selection, infrastructure_design, rag_agent_architecture, operations_model]
  monthlyBudgetUsd: [vector_db_selection, inference, finops, token_observability]
  # multi-region & tenancy
  requiresMultiRegion: [vector_db_selection, infrastructure_design, finops, operations_model]
  deploymentRegionCount: [vector_db_selection]
  trafficDistributionPercent: [vector_db_selection]
  dataReplicationModel: [vector_db_selection]
  regionalFailoverRequired: [vector_db_selection, infrastructure_design, finops, operations_model]
  crossRegionReplicationRequired: [vector_db_selection]
  tenancyModel: [vector_db_selection]
  # security & compliance
  requiresAuthentication: [vector_db_selection, security_governance]
  requiresRbac: [vector_db_selection, security_governance]
  requiresEncryptionAtRest: [vector_db_selection, workload_profile, security_governance]
  requiresEncryptionInTransit: [vector_db_selection, workload_profile, security_governance]
  requiresKeyManagement: [vector_db_selection, security_governance]
  requiresTenantIsolation: [vector_db_selection, rag_agent_architecture, security_governance]
  requiresAuditLogging: [vector_db_selection, security_governance]
  dataResidencyRequirement: [vector_db_selection, inference, workload_profile, infrastructure_design, security_governance]
  containsPii: [vector_db_selection, inference, workload_profile, rag_agent_architecture, security_governance]
  regulatoryRequirements: [workload_profile, security_governance]

# ---------------------------------------------------------------------------
# Guided workflow (spec §20). `phases` are the existing deliverables backing a
# step; `coverage` says how much of the spec's scope for that step exists
# today; `plannedWave` is where the remaining scope lands.
# ---------------------------------------------------------------------------
steps:
  - { number: 1,  key: use_case,        title: Use Case,              phases: [workload_profile],                   coverage: full,    note: "Business objective, criticality, users, applications, workload types and data sources - captured in the AI Workload Profile." }
  - { number: 2,  key: scale,           title: Scale,                 phases: [workload_profile, discovery],        coverage: full,    note: "Workload size and architecture classification, named deployment targets and data classification (AI Workload Profile), built on the vector Discovery answers." }
  - { number: 3,  key: data_embedding,  title: Data & Embedding,      phases: [data_embeddings],                    coverage: full,    note: "Chunking and embedding design, with every catalogue embedding model checked for eligibility (input limit, self-hosting, languages, lifecycle) and scored." }
  - { number: 4,  key: vectordb_index,  title: VectorDB & Index,      phases: [index_design, vector_db_selection],  coverage: full }
  - { number: 5,  key: model,           title: Model,                 phases: [model_selection],                    coverage: full,    note: "Primary, secondary and fallback model from a technology-neutral catalogue: mandatory eligibility first, then weighted scoring." }
  - { number: 6,  key: inference,       title: Inference,             phases: [inference, inference_architecture],  coverage: full,    note: "GPU sizing, latency and cost, plus the Inference Architecture: serving option (eligibility, then score), patterns, P50/P95/P99 estimates, and gateway, policy, router, autoscaling, fallback and observability design." }
  - { number: 7,  key: token_observability, title: Token Observability, phases: [token_observability], coverage: partial, plannedWave: 12, note: "Estimated tokens per request and per month, RAG and agent token breakdown, and cost from versioned prices. Simulated and live usage (normalized usage events, OpenTelemetry) follow in later Wave 12 phases." }
  - { number: 8,  key: infrastructure,  title: Infrastructure,        phases: [infrastructure_design, infrastructure], coverage: full, note: "Infrastructure Decision Record: placement of inference, vector database and application across on-premises, Azure, AWS, OCI and GCP (eligibility, then score), with compute, memory, storage, network, cluster, availability, DR, scaling and security; the vector-DB deployment plan provides the IaC." }
  - { number: 9,  key: rag_agent,       title: RAG / Agent,           phases: [rag_agent_architecture],             coverage: full,    note: "GenAI Application Architecture: retrieval strategy, reranking and agent orchestration (eligibility, then score), with filtering, context and prompt construction, citation, grounding, guardrails, human approval, tool security and isolation, plus context-window and latency budgets." }
  - { number: 10, key: security,        title: Security,              phases: [security_governance],                coverage: full,    note: "AI Security & Governance Assessment: policy status per component (approved / with conditions / restricted / not eligible) from where it processes data, plus the 18 spec §12 control areas traced to the designs that address them." }
  - { number: 11, key: performance,     title: Performance,           phases: [performance_benchmark, optimization], coverage: full,   note: "Performance & Benchmark Assessment: vector, embedding, LLM and infrastructure metrics with target, estimate and measurement kept apart; PASS / PASS WITH CONDITIONS / FAIL only on measured evidence, otherwise REQUIRES BENCHMARK." }
  - { number: 12, key: cost,            title: Cost,                  phases: [finops],                             coverage: full,    note: "Cost & FinOps Assessment: inference, vector DB, embedding, infrastructure and operations costs for the chosen design, compared across on-premises, Azure, AWS, OCI, GCP and hybrid - every figure labelled, never presented as a quote." }
  - { number: 13, key: operations,      title: Operations,            phases: [operations_model, capacity],         coverage: full,    note: "AI Operations Model: the 13 spec §14 areas, RTO / RPO / SLA checked against estimated recovery time and serial availability, scaling and failover policy, capacity thresholds, and whether the team can run what the design asks." }
  - { number: 14, key: final,           title: Final Recommendation,  phases: [final_recommendation],               coverage: full,    note: "Production-readiness gate (data, requirements, security, technology, performance, cost, operations), the final architecture and ADR, a primary recommendation with up to two eligible alternatives, and an implementation plan." }

# ---------------------------------------------------------------------------
# Wave 2 - AI Workload Profile (spec §4). Classification rules only; no cloud,
# vendor or model is preferred anywhere in this section.
# ---------------------------------------------------------------------------
workloadProfile:
  # Workload size: each dimension is classified against ascending upper bounds
  # (value < bound → that tier); above the last bound is extreme_scale. The
  # overall size is the HIGHEST tier across the dimensions that were answered,
  # so one very large dimension is never averaged away.
  sizeTiers: [small, medium, large, enterprise, extreme_scale]
  sizeDimensions:
    expectedVectorCount: { label: Vector count, bounds: [1000000, 10000000, 100000000, 1000000000] }
    dailyRequests: { label: Daily requests, bounds: [10000, 100000, 1000000, 10000000] }
    peakQps: { label: Peak QPS, bounds: [10, 100, 1000, 10000] }
    expectedUsers: { label: Expected users, bounds: [100, 1000, 10000, 100000] }
    concurrentUsers: { label: Concurrent users, bounds: [50, 500, 5000, 50000] }
    numberOfApplications: { label: Applications, bounds: [2, 4, 11, 51] }

  # Architecture class from the selected AI workload types. One class → that
  # class; more than one → hybrid, listing the components.
  architectureByWorkloadType:
    rag: rag
    question_answering: rag
    agentic: agent
    copilot: copilot
    genai: generative_ai
    summarization: generative_ai
    classification: generative_ai
    search: search
    recommendation: search
    multimodal: multimodal
    other: null
  # Data types that make any workload multimodal.
  multimodalDataTypes: [images, audio, video]
  architectureLabels:
    rag: RAG
    agent: Agent
    copilot: Copilot
    generative_ai: Generative AI
    search: Search
    multimodal: Multimodal
    hybrid: Hybrid

  # Data classification: the most sensitive level that applies wins.
  dataClassification:
    restricted: [containsPhi, containsPci]
    confidential: [containsPii, confidentialData]
    # otherwise: internal

  # Security controls implied by the data classification (spec §4 security requirements).
  requiredControls:
    restricted:
      - Encryption at rest with customer-managed keys
      - Encryption in transit (TLS 1.2+)
      - Private network endpoints only - no public model or vector endpoints
      - Audit logging of prompts, retrievals and responses with retention policy
      - Third-party model APIs only under a signed BAA / DPA with zero data retention
      - Role-based access control with least privilege
    confidential:
      - Encryption at rest
      - Encryption in transit (TLS 1.2+)
      - PII detection / redaction before data leaves the trust boundary
      - Audit logging
      - Role-based access control
    internal:
      - Encryption in transit (TLS 1.2+)
      - Authentication for every AI and data endpoint

  # Answers the profile needs before it counts as complete (spec §27.19: validate before proceeding).
  requiredInputs: [businessObjective, businessCriticality, workloadTypes, dataTypes, deploymentTargets, dailyRequests, expectedVectorCount]

# ---------------------------------------------------------------------------
# Wave 3 - eligibility layers for choices the existing engines make without
# one (spec §3). Applied in the AI Factory decision records only: the index
# and embedding engines are unchanged. When an existing choice fails a
# mandatory rule, the decision record flags the conflict for review instead
# of silently changing the deliverable.
# ---------------------------------------------------------------------------
indexEligibility:
  # Estimated index memory ÷ available memory.
  memoryNotEligibleAbove: 1.0
  memoryConditionalAbove: 0.8
  # Highest recall each family typically reaches with sensible tuning.
  maxTypicalRecall: { hnsw: 0.99, ivf_flat: 0.97, pq: 0.92 }
  # Within this distance of the ceiling the target is reachable but needs aggressive tuning → conditional.
  recallConditionalMargin: 0.02
  # Update frequencies at which a family needs periodic re-clustering / re-training → conditional.
  updateSensitive: { ivf_flat: [high], pq: [moderate, high] }

embeddingEligibility:
  # Relative quality score per catalogue qualityTier.
  qualityScore: { highest: 1.0, high: 0.8, medium: 0.6, low: 0.4 }
  # Providers that can run inside the customer's boundary (self-hosted).
  selfHostableProviders: [open_source]
  scoringWeights: { quality: 0.5, cost: 0.3, dimensionEfficiency: 0.2 }
  # Dimension at which the efficiency score is 1.0 (smaller vectors = less memory and faster search).
  referenceDimension: 768
  # Converts character-based chunk sizes to tokens (token_based chunking is used as-is).
  charsPerToken: 4

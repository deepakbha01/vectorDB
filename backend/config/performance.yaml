# AI Factory Wave 8 - Performance & Benchmark Assessment (spec §11).
# Read only by the ai-factory module.
#
# Spec rule: "Do not claim measured performance unless actual benchmark
# evidence exists." A metric is PASS / PASS WITH CONDITIONS / FAIL only when a
# measurement exists; otherwise it REQUIRES BENCHMARK, whatever the estimate
# says. Estimates, vendor figures and measurements are always labelled.

rulesVersion: performance-2026.09-1

statusLabels:
  pass: PASS
  pass_with_conditions: PASS WITH CONDITIONS
  fail: FAIL
  requires_benchmark: REQUIRES BENCHMARK
  not_applicable: Not applicable

# A measurement that misses its target by no more than this share is
# PASS WITH CONDITIONS rather than FAIL.
conditionalMarginPercent: 10

# A vector benchmark on fewer vectors than this share of the expected
# corpus (and fewer than minSampleVectors) is flagged as a small sample.
sampleCheck: { minShare: 0.1, minSampleVectors: 1000000, minIngestionDocuments: 1000 }

# Targets no earlier phase states. All are ASSUMPTIONS the architect can
# override by agreeing a target with the business.
assumedTargets:
  qualityByAccuracy: { standard: 0.7, high: 0.8, critical: 0.9 }   # task-level evaluation score (0-1)
  gpuUtilizationMaxPercent: 85          # headroom at peak
  gpuMemoryMaxPercent: 90
  cpuUtilizationMaxPercent: 80
  ramUtilizationMaxPercent: 80
  networkRoundTripMaxMs: 10             # per hop between components
  initialLoadHours: 24                  # embed the initial corpus within this window
networkEstimateMs: { single_target: 1, hybrid: 25 }

groups:
  - id: vector
    label: Vector benchmark
    metrics:
      - { id: recall, label: Recall, unit: '', direction: higher, measurable: true, how: "Run the Optimization benchmark on a representative sample at the configured top-K." }
      - { id: qps, label: QPS, unit: queries/s, direction: higher, measurable: true, how: "Optimization benchmark at peak concurrency." }
      - { id: search_latency_p95, label: Search latency P95, unit: ms, direction: lower, measurable: true, how: "Optimization benchmark - P95 of vector search at peak QPS." }
      - { id: search_latency_p99, label: Search latency P99, unit: ms, direction: lower, measurable: true, how: "Optimization benchmark - P99 of vector search at peak QPS." }
      - { id: index_build_time, label: Index build time, unit: min, direction: lower, measurable: true, how: "Time a full index build of the production-sized corpus (record the result here)." }
  - id: embedding
    label: Embedding benchmark
    metrics:
      - { id: embedding_tokens_per_sec, label: Tokens / sec, unit: tokens/s, direction: higher, measurable: true, how: "Run an ingestion of a representative batch (Ingestion phase) or time the embedding service directly." }
      - { id: documents_per_sec, label: Documents / sec, unit: docs/s, direction: higher, measurable: true, how: "Ingestion run over at least a few thousand representative documents." }
      - { id: embedding_cost, label: Cost (initial corpus), unit: USD, direction: lower, measurable: true, how: "Bill a pilot ingestion and scale to the corpus (record the result here)." }
  - id: llm
    label: LLM benchmark
    metrics:
      - { id: ttft_p50, label: TTFT P50, unit: ms, direction: lower, measurable: true, how: "Load-test the inference endpoint at peak concurrency with production-like prompts." }
      - { id: ttft_p95, label: TTFT P95, unit: ms, direction: lower, measurable: true, how: "Same load test - P95 time to first token." }
      - { id: ttft_p99, label: TTFT P99, unit: ms, direction: lower, measurable: true, how: "Same load test - P99 time to first token." }
      - { id: output_tokens_per_sec, label: Tokens / sec (per stream), unit: tokens/s, direction: higher, measurable: true, how: "Same load test - output tokens per second per stream at peak." }
      - { id: e2e_p95, label: End-to-end response P95, unit: ms, direction: lower, measurable: true, how: "Application-level test through the gateway, including retrieval, reranking and agent steps." }
      - { id: quality, label: Quality (evaluation score 0-1), unit: '', direction: higher, measurable: true, how: "Run the evaluation set (faithfulness, answer relevance, task success) and record the aggregate score." }
  - id: infrastructure
    label: Infrastructure
    metrics:
      - { id: gpu_utilization, label: GPU utilization at peak, unit: '%', direction: lower, measurable: true, how: "Record GPU utilisation during the LLM load test." }
      - { id: gpu_memory, label: GPU memory at peak, unit: '%', direction: lower, measurable: true, how: "Record GPU memory (weights + KV cache) during the LLM load test." }
      - { id: cpu_utilization, label: CPU at peak, unit: '%', direction: lower, measurable: true, how: "Record vector-database and application CPU during the combined load test." }
      - { id: ram_utilization, label: RAM at peak, unit: '%', direction: lower, measurable: true, how: "Record vector-database and application memory during the combined load test." }
      - { id: network, label: Network round trip per hop, unit: ms, direction: lower, measurable: true, how: "Measure gateway → runtime and application → vector DB round trips in the target network." }

# Inference Assessment catalogue.
#
# Loaded only by the inference module (InferenceConfigService) - the vector
# database engines never read this file. Every figure below is a DIRECTIONAL
# planning value: validate GPU prices against the customer's cloud contract,
# model architecture against the model's config.json, and API prices against
# the provider's current price sheet before quoting.

rulesVersion: inference-2026.10-3

# ---------------------------------------------------------------------------
# GPU catalogue - per-GPU figures. fp16Tflops / fp8Tflops / fp4Tflops are DENSE
# tensor throughput (not the 2x sparsity marketing number); fp4Tflops only on
# Blackwell and later. hourlyUsd is an on-demand, per-GPU cloud list price;
# reserved/spot use the factors under `pricing`. interconnect: nvlink | pcie -
# PCIe-only cards pay a tensor-parallel penalty (sizing.pcieTensorParallelFactor)
# when a model is split across GPUs. availability: preview marks a GPU that is
# not yet generally available - it is sized and costed, but only ever reported
# as a next-generation option, never recommended.
# ---------------------------------------------------------------------------
gpus:
  - id: l4
    label: NVIDIA L4 (24 GB)
    memoryGb: 24
    bandwidthGbps: 300
    fp16Tflops: 121
    fp8Tflops: 242
    hourlyUsd: 0.80
    interconnect: pcie
  - id: l40s
    label: NVIDIA L40S (48 GB)
    memoryGb: 48
    bandwidthGbps: 864
    fp16Tflops: 362
    fp8Tflops: 733
    hourlyUsd: 1.90
    interconnect: pcie
  # Blackwell PCIe card, no NVLink. NVIDIA lists 1 PFLOPS FP16 / 2 PFLOPS FP8 with
  # sparsity; dense is half. Price: AWS g7e.48xlarge on-demand ÷ 8.
  - id: rtx-pro-6000-96
    label: NVIDIA RTX PRO 6000 Blackwell Server (96 GB)
    memoryGb: 96
    bandwidthGbps: 1597
    fp16Tflops: 500
    fp8Tflops: 1000
    fp4Tflops: 2000
    hourlyUsd: 4.14
    interconnect: pcie
  - id: h100-80
    label: NVIDIA H100 SXM (80 GB)
    memoryGb: 80
    bandwidthGbps: 3350
    fp16Tflops: 989
    fp8Tflops: 1979
    hourlyUsd: 6.90
    interconnect: nvlink
  - id: h200-141
    label: NVIDIA H200 (141 GB)
    memoryGb: 141
    bandwidthGbps: 4800
    fp16Tflops: 989
    fp8Tflops: 1979
    hourlyUsd: 8.00
    interconnect: nvlink
  # Blackwell (HGX, 8 GPUs per node). Dense = half NVIDIA's sparse HGX figures
  # (36 PFLOPS FP16 / 72 PFLOPS FP8 per 8 GPUs); FP4 dense 72 PFLOPS per 8 GPUs.
  # Price: AWS p6-b200.48xlarge on-demand ÷ 8.
  - id: b200-180
    label: NVIDIA B200 SXM (180 GB)
    memoryGb: 180
    bandwidthGbps: 8000
    fp16Tflops: 2250
    fp8Tflops: 4500
    fp4Tflops: 9000
    hourlyUsd: 14.24
    interconnect: nvlink
  # Blackwell Ultra (HGX). Same FP16/FP8 as B200; more memory and FP4 (108 PFLOPS dense per 8 GPUs).
  # Price: AWS p6-b300.48xlarge on-demand ÷ 8.
  - id: b300-288
    label: NVIDIA B300 Blackwell Ultra SXM (288 GB)
    memoryGb: 288
    bandwidthGbps: 8000
    fp16Tflops: 2250
    fp8Tflops: 4500
    fp4Tflops: 13500
    hourlyUsd: 17.80
    interconnect: nvlink
  # Grace Blackwell rack (72 GPUs in one NVLink domain). Per GPU: NVL72 totals ÷ 72,
  # dense = half the sparse figures. Hyperscalers sell it by reservation or quote, so the
  # price is an ESTIMATE on the same basis as the rest: AWS B200 on-demand × the GB200 / B200
  # ratio of a public on-demand list (CoreWeave $10.50 / $8.60 per GPU-hour = 1.22).
  - id: gb200-186
    label: NVIDIA GB200 NVL72 (186 GB per GPU)
    memoryGb: 186
    bandwidthGbps: 8000
    fp16Tflops: 2500
    fp8Tflops: 5000
    fp4Tflops: 10000
    hourlyUsd: 17.40
    interconnect: nvlink
  # Grace Blackwell Ultra rack. No public on-demand price: ESTIMATE = GB200 × 1.25
  # (the AWS B300 / B200 on-demand ratio). Replace with the contracted rate.
  - id: gb300-288
    label: NVIDIA GB300 NVL72 (288 GB per GPU)
    memoryGb: 288
    bandwidthGbps: 8000
    fp16Tflops: 2500
    fp8Tflops: 5000
    fp4Tflops: 15000
    hourlyUsd: 21.75
    interconnect: nvlink
  # Rubin (Vera Rubin NVL72: 72 Rubin GPUs + 36 Vera CPUs). Per-GPU figures from NVIDIA's
  # NVL72 spec: 288 GB HBM4, 19.2 TB/s, dense FP16 4 / FP8 17.5 / NVFP4 35 PFLOPS.
  # PREVIEW: compared as a next-generation option, never recommended. No public price:
  # ESTIMATE = GB300 × 1.25 (a new-generation premium, the B300 / B200 ratio).
  - id: rubin-288
    label: NVIDIA Rubin, Vera Rubin NVL72 (288 GB per GPU)
    memoryGb: 288
    bandwidthGbps: 19200
    fp16Tflops: 4000
    fp8Tflops: 17500
    fp4Tflops: 35000
    hourlyUsd: 27.20
    interconnect: nvlink
    availability: preview
    availabilityNote: Ramping into production since mid-2026; first cloud capacity at specialist providers, broad hyperscaler and on-premises availability not yet confirmed. No public price - the cost shown is an estimate.

# ---------------------------------------------------------------------------
# Rack-scale systems: GPUs sold only as part of a whole rack (72 GPUs in one
# NVLink domain, with their Grace / Vera CPUs). The engine still sizes per GPU
# (gpuId), then:
#  - cloud: bills GPUs in whole instances of cloudUnitGpus (2 superchips = 4 GPUs);
#  - on-premises: Infrastructure Design counts whole racks and checks power and
#    liquid cooling; Cost Recommendation prices whole racks.
# rackPowerKw is a planning figure for facility checks: NVIDIA reference
# figures for GB200 (~120 kW) and GB300 (up to 142 kW); Vera Rubin is an
# ESTIMATE (secondary sources report 190-230 kW) - confirm with the OEM.
# ---------------------------------------------------------------------------
systems:
  - id: gb200-nvl72
    label: NVIDIA GB200 NVL72
    gpuId: gb200-186
    gpusPerRack: 72
    cpuLabel: NVIDIA Grace
    cpusPerRack: 36
    rackPowerKw: 120
    cooling: liquid
    cloudUnitGpus: 4
  - id: gb300-nvl72
    label: NVIDIA GB300 NVL72
    gpuId: gb300-288
    gpusPerRack: 72
    cpuLabel: NVIDIA Grace
    cpusPerRack: 36
    rackPowerKw: 142
    cooling: liquid
    cloudUnitGpus: 4
  - id: vera-rubin-nvl72
    label: NVIDIA Vera Rubin NVL72
    gpuId: rubin-288
    gpusPerRack: 72
    cpuLabel: NVIDIA Vera
    cpusPerRack: 36
    rackPowerKw: 230
    rackPowerEstimated: true
    cooling: liquid
    cloudUnitGpus: 4


# Inference Assessment catalogue.
#
# Loaded only by the inference module (InferenceConfigService) - the vector
# database engines never read this file. Every figure below is a DIRECTIONAL
# planning value: validate GPU prices against the customer's cloud contract,
# model architecture against the model's config.json, and API prices against
# the provider's current price sheet before quoting.

rulesVersion: inference-2026.09-1

# ---------------------------------------------------------------------------
# GPU catalogue - per-GPU figures. fp16Tflops / fp8Tflops are DENSE tensor
# throughput (not the 2x sparsity marketing number). hourlyUsd is an
# on-demand, per-GPU cloud list price; reserved/spot use the factors under
# `pricing`. interconnect: nvlink | pcie - PCIe-only cards pay a tensor-parallel
# penalty (sizing.pcieTensorParallelFactor) when a model is split across GPUs.
# ---------------------------------------------------------------------------
gpus:
  - id: l4
    label: NVIDIA L4 (24 GB)
    memoryGb: 24
    bandwidthGbps: 300
    fp16Tflops: 121
    fp8Tflops: 242
    hourlyUsd: 0.80
    interconnect: pcie
  - id: a10g
    label: NVIDIA A10G (24 GB)
    memoryGb: 24
    bandwidthGbps: 600
    fp16Tflops: 70
    hourlyUsd: 1.01
    interconnect: pcie
  - id: l40s
    label: NVIDIA L40S (48 GB)
    memoryGb: 48
    bandwidthGbps: 864
    fp16Tflops: 362
    fp8Tflops: 733
    hourlyUsd: 1.90
    interconnect: pcie
  - id: a100-40
    label: NVIDIA A100 (40 GB)
    memoryGb: 40
    bandwidthGbps: 1555
    fp16Tflops: 312
    hourlyUsd: 3.00
    interconnect: nvlink
  - id: a100-80
    label: NVIDIA A100 (80 GB)
    memoryGb: 80
    bandwidthGbps: 2039
    fp16Tflops: 312
    hourlyUsd: 3.70
    interconnect: nvlink
  - id: h100-80
    label: NVIDIA H100 SXM (80 GB)
    memoryGb: 80
    bandwidthGbps: 3350
    fp16Tflops: 989
    fp8Tflops: 1979
    hourlyUsd: 6.90

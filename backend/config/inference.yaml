# ---------------------------------------------------------------------------
# Serving precision. bytesPerParam includes quantisation scale overhead.
# computeUsesFp8: prefill runs on FP8 tensor cores (needs fp8Tflops on the GPU).
# ---------------------------------------------------------------------------
precisions:
  - id: fp16
    label: FP16 / BF16
    bytesPerParam: 2
    kvBytes: 2
    requiresFp8Hardware: false
    computeUsesFp8: false
    qualityNote: Reference quality.
  - id: fp8
    label: FP8 (W8A8)
    bytesPerParam: 1
    kvBytes: 1
    requiresFp8Hardware: true
    computeUsesFp8: true
    qualityNote: Near-lossless on most benchmarks; validate on the customer's eval set.
  - id: int8
    label: INT8 weight-only
    bytesPerParam: 1.05
    kvBytes: 2
    requiresFp8Hardware: false
    computeUsesFp8: false
    qualityNote: Small quality loss; validate on the customer's eval set.
  - id: int4
    label: INT4 weight-only (AWQ / GPTQ)
    bytesPerParam: 0.55
    kvBytes: 2
    requiresFp8Hardware: false
    computeUsesFp8: false
    qualityNote: Noticeable quality loss on reasoning/code for smaller models - evaluate before committing.
  # NVFP4: 4-bit values plus one FP8 scale per 16 = 4.5 bits per weight; KV cache kept at FP8.
  # Blackwell and later only - prefill runs at the GPU's FP4 rate.
  - id: fp4
    label: FP4 (NVFP4, Blackwell / Rubin only)
    bytesPerParam: 0.5625
    kvBytes: 1
    requiresFp8Hardware: true
    computeUsesFp8: true
    requiresFp4Hardware: true
    computeUsesFp4: true
    qualityNote: Close to FP8 for most models once quantised with calibration; a small loss is possible on reasoning and code - validate on the customer's eval set.
# 'auto' evaluates only these (quality-preserving) precisions; int8/int4/fp4 must be chosen explicitly.
autoPrecisions: [fp16, fp8]

# ---------------------------------------------------------------------------
# Managed pay-per-token API tiers - USD per 1M tokens. Representative list
# prices for a typical model in each tier; the assessment accepts contracted
# prices as overrides.
# ---------------------------------------------------------------------------
managedApiTiers:
  - id: small
    label: Small / fast model tier
    inputPer1M: 0.15
    outputPer1M: 0.60
  - id: mid
    label: Mid-size general model tier
    inputPer1M: 3.00
    outputPer1M: 15.00
  - id: frontier
    label: Frontier / largest model tier
    inputPer1M: 15.00
    outputPer1M: 75.00

# ---------------------------------------------------------------------------
# Serving-performance model (roofline approximation - see inference-engine.service.ts)
# ---------------------------------------------------------------------------
sizing:
  gpuMemoryUtilization: 0.90       # share of GPU memory the server may use (vLLM default)
  runtimeOverheadGbPerGpu: 2       # CUDA context, activations, graph capture
  bandwidthEfficiency: 0.70        # achieved vs peak HBM bandwidth during decode
  prefillMfu: 0.40                 # achieved vs peak tensor FLOPS during prefill
  tensorParallelOptions: [1, 2, 4, 8]
  tensorParallelEfficiency: { "1": 1.0, "2": 0.92, "4": 0.85, "8": 0.75 }
  pcieTensorParallelFactor: 0.75   # extra all-reduce cost when TP > 1 on GPUs without NVLink
  maxBatchPerReplica: 256          # scheduler cap on concurrent sequences
  targetUtilization: 0.70          # headroom so queues do not grow unbounded at peak
  ttftContentionFactor: 1.5        # prefill interleaving with running decodes under load
  haAvailabilityThreshold: 99.9    # at or above this, keep >= 2 replicas
  charsPerToken: 4                 # used to convert character-based chunk sizes to tokens
  ragPromptOverheadTokens: 500     # system prompt + user question on top of retrieved chunks (RAG defaults)

pricing:
  hoursPerMonth: 730
  daysPerMonth: 30.4
  reserved1yrFactor: 0.60          # 1-year commitment vs on-demand
  spotFactor: 0.40                 # interruptible capacity - not advised for latency SLOs
  peakHoursFraction: 0.20          # share of the month running at peak replica count (autoscaled)
  selfHostedOverheadPercent: 20    # storage, networking, load balancing, observability on top of GPUs
  platformFixedMonthlyUsd: 4000    # ~0.25 FTE of MLOps/platform engineering to run self-hosted serving
  decisionMarginPercent: 20        # cost difference below which the decision is called "either"

forecast:
  horizonsMonths: [6, 12, 24]

breakEven:
  minScale: 0.01
  maxScale: 100
  points: 61

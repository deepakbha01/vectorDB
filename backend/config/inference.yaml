    label: Llama 3.1 8B Instruct
    paramsB: 8.03
    activeParamsB: 8.03
    layers: 32
    kvHeads: 8
    headDim: 128
    maxContextTokens: 131072
    licence: Llama 3.1 Community License (acceptable-use policy; 700M MAU clause)
  - id: qwen2.5-7b
    label: Qwen2.5 7B Instruct
    paramsB: 7.6
    activeParamsB: 7.6
    layers: 28
    kvHeads: 4
    headDim: 128
    maxContextTokens: 32768
    licence: Apache 2.0
  - id: mistral-small-24b
    label: Mistral Small 3 (24B)
    paramsB: 23.6
    activeParamsB: 23.6
    layers: 40
    kvHeads: 8
    headDim: 128
    maxContextTokens: 32768
    licence: Apache 2.0
  - id: mixtral-8x7b
    label: Mixtral 8x7B Instruct (MoE)
    paramsB: 46.7
    activeParamsB: 12.9
    layers: 32
    kvHeads: 8
    headDim: 128

# Embedding provider/model catalog used by the Design Engine (Phase 2).
# Dimensions and max input sizes reflect each vendor's published specs;
# costPerMillionTokens is an approximate list price - verify against the
# vendor's current pricing page before using it for a real cost estimate.
#
# status/region/evidence/lastVerifiedDate (spec S8.3 model lifecycle):
# - status: active | deprecated | retired. 'retired' models are rejected at
#   Phase 2 submit time; 'deprecated' models are allowed but warn.
# - evidence/lastVerifiedDate record where these figures came from and when
#   they were last checked - update both whenever you refresh this file.
providers:
  - id: openai
    label: "OpenAI"
    models:
      - id: text-embedding-3-small
        label: "text-embedding-3-small"
        dimension: 1536
        maxInputTokens: 8191
        costPerMillionTokens: 0.02
        languageSupport: ["en", "multilingual-partial"]
        qualityTier: high
        modelVersion: "3-small"
        status: active
        region: "global (OpenAI API)"
        evidence: "OpenAI published model documentation and pricing page"
        lastVerifiedDate: "2026-06-01"
      - id: text-embedding-3-large
        label: "text-embedding-3-large"
        dimension: 3072
        maxInputTokens: 8191
        costPerMillionTokens: 0.13
        languageSupport: ["en", "multilingual-partial"]
        qualityTier: highest

# Azure AI Factory Builder - Phase 3 (Architect) catalog (spec 8.2, 8.3, 4.4).
# Read only by the azure-builder module (architecture.ts).
#
# The rules engine is deterministic: it picks components from this catalog and
# applies environment rules. Nothing here is generated by an LLM.
#
# RATES ARE DIRECTIONAL PLANNING RATES, NOT QUOTES. They are approximate
# pay-as-you-go list prices in USD, used to compare options like-for-like
# while the builder runs offline. Real prices vary by region, agreement,
# commitment and time. The live-Azure wave replaces them with the Azure Retail
# Prices API (https://prices.azure.com/api/retail/prices). Every estimate is
# labelled accordingly and lists its assumptions.

rulesVersion: azure-builder-architect-2026.10-1
lastReviewed: '2026-10-07'
currency: USD
hoursPerMonth: 730

# RAG knowledge assistant - component -> Azure Verified Module map (spec 8.2).
# zone groups the diagram; module versions are pinned in Phase 4 (Generate IaC).
patterns:
  rag-assistant:
    components:
      aoai:           { type: ai-foundry-account,  label: Azure OpenAI (Foundry) account,     module: avm/res/cognitive-services/account,             zone: ai }
      search:         { type: ai-search,           label: Azure AI Search,                    module: avm/res/search/search-service,                  zone: data }
      storage:        { type: storage-account,     label: Storage (documents),                module: avm/res/storage/storage-account,                zone: data }
      keyvault:       { type: key-vault,           label: Key Vault,                          module: avm/res/key-vault/vault,                        zone: data }
      cosmos:         { type: cosmos-db,           label: Cosmos DB (chat history),           module: avm/res/document-db/database-account,           zone: data }
      identity:       { type: managed-identity,    label: User-assigned managed identity,     module: avm/res/managed-identity/user-assigned-identity, zone: app }
      cae:            { type: container-apps-env,  label: Container Apps environment,         module: avm/res/app/managed-environment,                zone: app }
      app:            { type: container-app,       label: Assistant API (Container App),      module: avm/res/app/container-app,                      zone: app }
      apim:           { type: api-management,      label: API Management (AI gateway),        module: avm/res/api-management/service,                 zone: edge }
      bot:            { type: bot-service,         label: Azure Bot (Teams channel),          module: modules/bot-service.bicep,         zone: edge }   # no AVM module is published yet (status: Proposed) - native resource in a thin wrapper
      log-analytics:  { type: log-analytics,       label: Log Analytics workspace,            module: avm/res/operational-insights/workspace,         zone: monitoring }
      app-insights:   { type: app-insights,        label: Application Insights,               module: avm/res/insights/component,                     zone: monitoring }
      vnet:           { type: virtual-network,     label: Use-case spoke VNet,                module: avm/res/network/virtual-network,                zone: network }
      hub-vnet:       { type: virtual-network,     label: Hub VNet (existing),                module: avm/res/network/virtual-network,                zone: network }
      private-endpoints: { type: private-endpoints, label: Private endpoints,                 module: avm/res/network/private-endpoint,               zone: network }
      private-dns:    { type: private-dns-zones,   label: Private DNS zones,                  module: avm/res/network/private-dns-zone,               zone: network }

# Private DNS zone per private-endpoint target.
privateDnsZones:
  aoai: [privatelink.openai.azure.com, privatelink.cognitiveservices.azure.com]
  search: [privatelink.search.windows.net]
  storage: [privatelink.blob.core.windows.net]
  keyvault: [privatelink.vaultcore.azure.net]
  cosmos: [privatelink.documents.azure.com]

models:
  chat: gpt-4o
  embedding: text-embedding-3-large
  embeddingDimensions: 1536
  embeddingCapacityK: 100    # thousand tokens/min for indexing; directional
  queryEmbeddingTokens: 30   # per request, embedded at query time

# Azure OpenAI data zones (Data Zone Standard deployments keep processing in the zone).
dataZones:
  EU: [westeurope, northeurope, swedencentral, francecentral, germanywestcentral, italynorth, polandcentral, spaincentral, norwayeast, switzerlandnorth]
  US: [eastus, eastus2, centralus, northcentralus, southcentralus, westus, westus2, westus3]

# Capacity rule (spec 8.3): peak tokens/min above the threshold -> provisioned throughput.
ptu:
  thresholdTpm: 400000
  tpmPerPtu: 2500          # directional for gpt-4o; confirm with the Azure OpenAI capacity calculator
  minimumPtu: 15

# Workload assumptions used when the intake does not say. All are listed on the estimate.
workload:
  requestsPerUserPerMonth: 20
  requestsPerConcurrentUserPerMinute: 0.5
  inputTokensPerRequest: 3000          # system prompt + question + retrieved chunks
  outputTokensPerRequest: 500
  extractableTextRatio: 0.1            # share of document bytes that is text
  bytesPerToken: 4
  tokensPerChunk: 512
  indexOverheadRatio: 1.3              # inverted index and metadata on top of the text
  monthlyChangedShare: { static: 0, weekly: 0.05, daily: 0.1, hourly: 0.15, realtime: 0.2 }
  logGbPerMonth: { dev: 2, test: 5, prod: 20 }
  chatHistoryRuPerRequest: 10
  chatHistoryKbPerRequest: 4
  apiReplicas: { dev: 1, test: 1, prod: 2 }
  apiReplicaSize: { vcpu: 1, gib: 2 }

# Azure AI Search tiers: vector index quota per partition (GB), max partitions.
searchTiers:
  - { tier: basic,     vectorGbPerPartition: 5,   storageGbPerPartition: 15,  maxPartitions: 3 }
  - { tier: standard,  vectorGbPerPartition: 35,  storageGbPerPartition: 160, maxPartitions: 12 }
  - { tier: standard2, vectorGbPerPartition: 150, storageGbPerPartition: 512, maxPartitions: 12 }

searchReplicas:          # by availability target, prod only (first match wins)
  - { minAvailability: 99.95, replicas: 3 }
  - { minAvailability: 99.9, replicas: 2 }
  - { minAvailability: 0, replicas: 1 }

rates:
  models:
    gpt-4o: { inputPer1M: 2.50, outputPer1M: 10.00 }
    text-embedding-3-large: { inputPer1M: 0.13 }
  regionalDeploymentUplift: 1.10       # Standard (regional) and Data Zone Standard vs Global Standard
  ptuHour: 1.00                        # per PTU, hourly provisioned (no reservation)
  searchUnitMonth: { basic: 73.73, standard: 245.28, standard2: 981.12 }
  containerApps: { vcpuSecond: 0.000024, gibSecond: 0.000003 }
  storageGbMonth: { lrs: 0.0184, zrs: 0.023 }
  keyVaultMonth: 1.00
  logAnalyticsPerGb: 2.30
  privateEndpointHour: 0.01
  privateDnsZoneMonth: 0.50
  apimMonth: { developer: 48.04, standardv2: 700.00 }
  cosmosServerless: { per1MRu: 0.25, gbMonth: 0.25 }

# Phase 4 (Generate IaC) - spec 4.5 and 11. Module versions are pinned (spec 11.1) and
# were checked against the public Bicep registry (mcr.microsoft.com) on lastReviewed.
iac:
  avm:
    avm/res/cognitive-services/account: 0.19.1
    avm/res/search/search-service: 0.13.0
    avm/res/storage/storage-account: 0.33.1
    avm/res/key-vault/vault: 0.14.2
    avm/res/document-db/database-account: 0.21.1
    avm/res/managed-identity/user-assigned-identity: 0.6.0
    avm/res/app/managed-environment: 0.16.0
    avm/res/app/container-app: 0.23.0
    avm/res/api-management/service: 0.15.0
    avm/res/operational-insights/workspace: 0.16.1
    avm/res/insights/component: 0.8.0
    avm/res/network/virtual-network: 0.10.2
    avm/res/network/private-dns-zone: 0.8.1
    # Each resource module creates its own endpoints through its privateEndpoints parameter (using this module).
    avm/res/network/private-endpoint: 0.12.1
  botServiceApiVersion: '2022-09-15'
  modelVersions:
    gpt-4o: '2024-11-20'
    text-embedding-3-large: '1'
  raiPolicyName: Microsoft.DefaultV2     # Content Safety on every model deployment (spec 12)
  # Placeholder image until the team publishes the assistant API image; README says so.
  placeholderImage: mcr.microsoft.com/k8se/quickstart:latest
  placeholderPort: 80
  # CAF abbreviations (https://learn.microsoft.com/azure/cloud-adoption-framework/ready/azure-best-practices/resource-abbreviations)
  regionAbbreviations:
    centralindia: cin
    southindia: sin
    westindia: win
    eastus: eus
